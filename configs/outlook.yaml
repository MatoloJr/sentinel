# Seasonal outlook training config, used by `python -m sentinel.train` and the Colab notebook.
# Anything left out falls back to sentinel/train.py DEFAULT_CONFIG.
n_trials: 40          # Optuna trials (each = n_folds model fits)
seed: 0

cv:
  n_folds: 4          # rolling-origin folds before the held-out test period
  fold_years: 2       # validation years per fold

search:
  kinds: [logistic, gbm]
  calibration: [null, sigmoid, isotonic]
  logistic:
    C: [0.01, 3.0]
  gbm:
    max_depth: [2, 5]
    learning_rate: [0.01, 0.2]
    max_iter: [50, 400]
    min_samples_leaf: [20, 120]
    l2_regularization: [0.0, 5.0]

# warning threshold search [start, stop, step]; starts above climatology (1/3)
threshold_grid: [0.34, 0.6, 0.02]
