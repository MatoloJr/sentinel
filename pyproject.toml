[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-sentinel"
version = "2.0.0"
description = "Climate Sentinel Kenya: drought, heavy-rain and cyclone early-warning support (pipeline, outlook model, API)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pyarrow>=15", "requests>=2.31",
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3", "joblib>=1.3", "pyyaml>=6.0", "optuna>=3.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
sentinel-train = "sentinel.train:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["playbook.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
